<div class="new-container">
    <div class="card-container">
      <button class="home-button" routerLink="/">
        <img src="/assets/images/home-link-logo.png" alt="Home">
      </button>
      <div class="card-content">
        <div class="form-group" *ngIf="recipe">
          <div class="header">
            <h2>{{ recipe.recipeName }}</h2>
          </div>
          <div class="input-group">
            <div class="secondary-headers">
              <p class="creator-header"><strong>Creator:</strong> {{ recipe.recipeCreator }}</p>
              <p><strong>Creation Date:</strong> {{ recipe.creationDate }}</p>
            </div>
            <textarea class="form-control text-area" >{{ recipe.recipeContent }}</textarea> <!--[(ngModel)]="recipeContent"--> 
          </div>
          <button class="btn btn-primary save-button" routerLink="/search-recipes">All Recipes</button>
        </div>
      </div>
    </div>
  </div>
